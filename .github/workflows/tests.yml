name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest
      # Two upstream symlink tests fail on upstream's own code at v1.36.1
      # (message and behaviour of _resolve_source_file changed without the
      # tests following). They are not part of the fork; drop the deselect
      # once upstream fixes them.
      - run: >-
          python -m pytest tests -v
          --deselect tests/test_smoke.py::TestSecurityPathTraversal::test_symlink_escaping_allowed_dir
          --deselect tests/test_smoke.py::TestSecurityPathTraversal::test_symlink_rejected
